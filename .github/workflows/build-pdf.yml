name: Build PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile complete document
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Typst
        uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1

      - name: Create build directory
        run: mkdir -p build

      - name: Compile PDF
        run: typst compile main.typ build/Typist_Template.pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v7
        with:
          name: Typist_Template-PDF
          path: build/Typist_Template.pdf
          if-no-files-found: error
          retention-days: 30
